name: Compilar y Publicar JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar proyecto con Ant (NetBeans)
        run: |
          cd TiendaPedidosMultiflujo
          ant clean jar

      - name: Subir ejecutable JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TiendaPedidosMultiflujo-JAR
          path: TiendaPedidosMultiflujo/dist/*.jar
